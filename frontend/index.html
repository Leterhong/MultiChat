<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MultiChat</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1a1a'/><text x='16' y='22' font-family='system-ui' font-size='18' font-weight='700' text-anchor='middle' fill='white'>M</text></svg>" />
</head>
<body>

<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">M</div>
      <div>MultiChat</div>
    </div>
    <button class="new-chat" id="newChatBtn">
      <span class="plus">+</span> 新对话
    </button>
    <input class="conv-search" id="convSearch" placeholder="搜索对话…" />
    <div class="conv-section-title">最近</div>
    <div class="conv-list" id="convList">
      <div style="padding:18px 12px; color:var(--label-caption); font-size:12.5px;">还没有对话</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">新对话</div>
      <div class="topbar-spacer"></div>
      <button class="model-picker" id="workspacePicker" style="max-width:180px;">
        <span class="mp-name" id="workspacePickerName">默认工作区</span>
        <span class="mp-caret">▾</span>
      </button>
      <button class="model-picker" id="agentPicker" style="max-width:200px;">
        <span class="mp-name" id="agentPickerName">无智能体</span>
        <span class="mp-caret">▾</span>
      </button>
      <button class="icon-btn" id="forkBtn" title="从当前对话创建一个分支副本">分支</button>
      <button class="icon-btn" id="settingsBtn">设置</button>
    </div>

    <div class="content" id="content"></div>

    <div class="composer-wrap" id="composerWrap">
      <div class="composer">
        <div class="file-ctx" id="fileCtx">
          <div class="file-ctx-head" id="fileCtxHead">
            <span class="fc-title">文件上下文</span>
            <span class="fc-count" id="fcCount">0 个文件</span>
            <span class="spacer"></span>
            <button class="fc-min" id="fcMin" title="折叠/展开">▾</button>
          </div>
          <div class="file-ctx-body" id="fileCtxBody"></div>
        </div>
        <textarea class="composer-input" id="input" rows="1" placeholder="发消息…" autocomplete="off"></textarea>
        <div class="composer-actions">
          <button class="hero-tag" id="composerModelTag" title="点击选择模型">选择模型</button>
          <span style="font-size:12px; color:var(--label-caption);" id="ctxHint">Shift+Enter 换行</span>
          <div class="spacer"></div>
          <button class="send-btn" id="sendBtn" title="发送">↑</button>
        </div>
      </div>
      <div class="composer-hint">内容由 AI 生成，仅供参考</div>
    </div>
  </main>
</div>

<!-- Settings panel -->
<div class="scrim" id="scrim"></div>
<div class="settings" id="settings">
  <div class="settings-side">
    <h2>设置</h2>
    <button class="settings-tab active" data-tab="general">
      <svg class="tab-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>通用设置</span>
    </button>
    <button class="settings-tab" data-tab="workspace">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/><path d="M3 7V5h7l2 2"/></svg><span>工作区</span>
    </button>
    <button class="settings-tab" data-tab="providers">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><span>模型</span>
    </button>
    <button class="settings-tab" data-tab="agents">
      <svg class="tab-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M8 14c1.333 1 2.667 1 4 1s2.667 0 4-1"/></svg><span>智能体</span>
    </button>
    <button class="settings-tab" data-tab="skills">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1 5 5l-7 7-5 1 1-5z"/><path d="M3 21l6-6"/></svg><span>技能</span>
    </button>
    <button class="settings-tab" data-tab="plugins">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12l8.73-5.04M12 22V12"/></svg><span>插件</span>
    </button>
    <button class="settings-tab" data-tab="runs">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 5-7"/></svg><span>运行记录</span>
    </button>
    <div style="flex:1"></div>
    <button class="settings-tab" id="closeSettings" style="color:var(--label-caption)">
      <span>✕</span><span>关闭</span>
    </button>
  </div>
  <div class="settings-body" id="settingsBody"></div>
  <div class="settings-top">
    <button class="icon-btn" id="closeSettingsTop" title="关闭">✕</button>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="toast" id="toast"></div>


<script type="module" src="/src/main.ts"></script>
</body>
</html>
