<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MultiChat</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1a1a'/><text x='16' y='22' font-family='system-ui' font-size='18' font-weight='700' text-anchor='middle' fill='white'>M</text></svg>" />
  <script type="module" crossorigin src="/assets/index-ClbC09ja.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Vl544CDv.css">
</head>
<body>

<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="对话导航">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">M</div>
      <div class="brand-copy"><strong>MultiChat</strong><span>LOCAL AGENT ORBIT</span></div>
      <button class="sidebar-close" id="sidebarClose" aria-label="关闭对话导航">×</button>
    </div>
    <button class="new-chat" id="newChatBtn">
      <span class="new-chat-icon" aria-hidden="true">＋</span><span>新建对话</span><kbd>⌘ N</kbd>
    </button>
    <label class="conv-search-wrap"><span aria-hidden="true">⌕</span><input class="conv-search" id="convSearch" placeholder="搜索对话…" aria-label="搜索对话" /></label>
    <div class="conv-section-title">最近</div>
    <div class="conv-list" id="convList">
      <div style="padding:18px 12px; color:var(--label-caption); font-size:12.5px;">还没有对话</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="mobile-menu" id="sidebarToggle" aria-label="打开对话导航" aria-expanded="false">☰</button>
      <div class="topbar-context"><div class="topbar-kicker">WORKSPACE</div><div class="topbar-title" id="topbarTitle">新对话</div></div>
      <div class="topbar-spacer"></div>
      <button class="model-picker" id="workspacePicker" style="max-width:180px;">
        <span class="mp-name" id="workspacePickerName">默认工作区</span>
        <span class="mp-caret">▾</span>
      </button>
      <button class="model-picker" id="agentPicker" style="max-width:200px;">
        <span class="mp-name" id="agentPickerName">无智能体</span>
        <span class="mp-caret">▾</span>
      </button>
      <button class="icon-btn" id="forkBtn" title="从当前对话创建一个分支副本" aria-label="创建分支"><span aria-hidden="true">⑂</span><span class="icon-btn-label">分支</span></button>
      <button class="icon-btn" id="settingsBtn" aria-label="设置"><span aria-hidden="true">⌘</span><span class="icon-btn-label">设置</span></button>
    </div>

    <div class="content" id="content"></div>

    <div class="composer-wrap" id="composerWrap">
      <div class="composer">
        <div class="file-ctx" id="fileCtx">
          <div class="file-ctx-head" id="fileCtxHead">
            <span class="fc-title">文件上下文</span>
            <span class="fc-count" id="fcCount">0 个文件</span>
            <span class="spacer"></span>
            <button class="fc-min" id="fcMin" title="折叠/展开">▾</button>
          </div>
          <div class="file-ctx-body" id="fileCtxBody"></div>
        </div>
        <textarea class="composer-input" id="input" rows="1" placeholder="发消息…" autocomplete="off"></textarea>
        <div class="composer-actions">
          <button class="composer-tool" id="composerFileBtn" type="button" title="添加或管理上下文文件" aria-label="添加或管理上下文文件"><span aria-hidden="true">＋</span><span class="composer-tool-label" id="composerFileLabel">文件</span></button>
          <button class="hero-tag" id="composerModelTag" title="点击选择模型">选择模型</button>
          <span style="font-size:12px; color:var(--label-caption);" id="ctxHint">Shift+Enter 换行</span>
          <div class="spacer"></div>
          <button class="send-btn" id="sendBtn" title="发送">↑</button>
        </div>
      </div>
      <div class="composer-hint">内容由 AI 生成，仅供参考</div>
    </div>
  </main>
</div>

<div class="mobile-scrim" id="mobileScrim"></div>

<!-- Settings panel -->
<div class="scrim" id="scrim"></div>
<div class="settings" id="settings" role="dialog" aria-modal="true" aria-label="MultiChat 控制中心" aria-hidden="true" inert>
  <div class="settings-side">
    <div class="settings-brand"><div class="brand-logo" aria-hidden="true">M</div><div><strong>控制中心</strong><span>MultiChat System</span></div></div>
    <button class="settings-tab active" data-tab="general">
      <svg class="tab-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>通用设置</span>
    </button>
    <button class="settings-tab" data-tab="workspace">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/><path d="M3 7V5h7l2 2"/></svg><span>工作区</span>
    </button>
    <button class="settings-tab" data-tab="providers">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><span>模型</span>
    </button>
    <button class="settings-tab" data-tab="agents">
      <svg class="tab-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M8 14c1.333 1 2.667 1 4 1s2.667 0 4-1"/></svg><span>智能体</span>
    </button>
    <button class="settings-tab" data-tab="skills">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg><span>Skills</span>
    </button>
    <button class="settings-tab" data-tab="tools">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1 5 5l-7 7-5 1 1-5z"/><path d="M3 21l6-6"/></svg><span>内置工具</span>
    </button>
    <button class="settings-tab" data-tab="mcp">
      <svg class="tab-ico" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.7 15.3 7.3M8.7 13.3l6.6 3.4"/></svg><span>MCP</span>
    </button>
    <button class="settings-tab" data-tab="plugins">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12l8.73-5.04M12 22V12"/></svg><span>插件</span>
    </button>
    <button class="settings-tab" data-tab="capabilities">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg><span>能力审计</span>
    </button>
    <button class="settings-tab" data-tab="usage">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/><path d="M2 19h20"/></svg><span>用量中心</span>
    </button>
    <button class="settings-tab" data-tab="runs">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 5-7"/></svg><span>运行记录</span>
    </button>
    <div style="flex:1"></div>
    <button class="settings-tab settings-close-side" id="closeSettings" style="color:var(--label-caption)">
      <span>✕</span><span>关闭</span>
    </button>
  </div>
  <div class="settings-body" id="settingsBody" tabindex="-1"></div>
  <div class="settings-top">
    <button class="icon-btn close-round" id="closeSettingsTop" title="关闭" aria-label="关闭设置">✕</button>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-live="polite" aria-hidden="true" inert>
  <div class="modal-card" id="modalCard" tabindex="-1"></div>
</div>

<div class="toast" id="toast"></div>


</body>
</html>
