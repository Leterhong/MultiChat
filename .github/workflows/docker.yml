name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & publish image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      # arm64 可后续以 QEMU 加入（platforms: linux/amd64,linux/arm64），先保证 amd64 快速反馈。
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: multichat:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 容器级 Linux 冒烟：真实启动镜像并探测健康检查端点。
      - name: Smoke test container
        run: |
          docker run -d --name mc-smoke -p 3000:3000 multichat:smoke
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::容器健康检查未通过"
            docker logs mc-smoke | tail -60
            exit 1
          fi
          echo "health: $(cat /tmp/health.json)"
          curl -sf http://127.0.0.1:3000/ | head -c 120
          docker rm -f mc-smoke > /dev/null
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
