name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests + syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Run integration tests (smoke / approval / filecontext)
        run: npm test
      - name: Syntax check all backend modules
        run: |
          for f in lib/*.js runtime/*.js routes/*.js adapters/*.js mcp.js server.js; do
            node --check "$f" || exit 1
          done
      - name: Lint (eslint — errors block, warnings allowed)
        run: npm run lint

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 注意：本地 Windows 生成的 lock 只记录了 win32 的 esbuild/rollup 平台二进制，
      # 若用 npm ci 严格按 lock 安装，ubuntu runner 会缺 linux 原生二进制导致 vite build 崩溃。
      # 改用 npm install 让 runner 按当前平台重新解析并安装正确的原生依赖。
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build (vite)
        run: npm run build
      - name: Lint (eslint — errors block, warnings allowed)
        run: npm run lint
