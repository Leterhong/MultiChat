name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests + syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Run integration tests (smoke / approval / filecontext)
        run: npm test
      - name: Syntax check all backend modules
        run: |
          for f in lib/*.js runtime/*.js routes/*.js adapters/*.js mcp.js server.js; do
            node --check "$f" || exit 1
          done
      - name: Lint (eslint — errors block, warnings allowed)
        run: npm run lint

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 本地 Windows 生成的 lock 只记录了 win32 的 esbuild/rollup 平台二进制，
      # npm ci 严格按 lock 只装 win32、npm install 也会沿用 lock 的 win32 记录，
      # 都会导致 ubuntu runner 缺 linux 原生二进制、vite import rollup 时崩溃。
      # 用 --no-package-lock 完全忽略 lock，让 runner 在 linux 上重新解析并装正确平台的原生依赖。
      - name: Install deps
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build (vite)
        run: npm run build
      - name: Lint (eslint — errors block, warnings allowed)
        run: npm run lint
