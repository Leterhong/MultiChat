name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests + syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      # lockfile 含全平台原生二进制记录（esbuild/rollup 的 linux/darwin/win32 变体），
      # npm ci 可复现安装。若更换依赖，请在本地 npm install 后提交同步的 lock。
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Run backend tests
        run: npm test
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Build backend runtime
        run: npm run build
      - name: Syntax check JavaScript compatibility entries
        run: |
          node --check .eslintrc.cjs
          node --check extensions/demo-mcp-server.js
      - name: Lint (eslint — errors block, warnings allowed)
        run: npm run lint
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build (vite)
        run: npm run build
      - name: Frontend tests and accessibility checks
        run: npm test
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (eslint — errors block, warnings allowed)
        run: npm run lint
      - name: Lint styles
        run: npm run lint:css
  smoke-linux:
    name: Linux runtime smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install deps
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Boot and probe (npx 路径的真实启动)
        run: |
          node ./bin/multichat.mjs web --port 3199 --no-open --data-dir ./.smoke-data > ./.smoke.log 2>&1 &
          server_pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3199/api/health > /tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          kill $server_pid 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "::error::Linux 冒烟启动失败"
            tail -60 ./.smoke.log
            exit 1
          fi
          echo "health: $(cat /tmp/health.json)"
          curl -sf http://127.0.0.1:3199/ | head -c 120
          echo
          grep -q "backend 源码比" ./.smoke.log && { echo "::error::构建产物落后于源码"; exit 1; } || true
