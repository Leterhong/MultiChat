name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests + syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      # 在 Linux runner 上重新解析跨平台依赖，避免复用本机平台二进制。
      - name: Install deps
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run backend tests
        run: npm test
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Build backend runtime
        run: npm run build
      - name: Syntax check JavaScript compatibility entries
        run: |
          node --check .eslintrc.cjs
          node --check extensions/demo-mcp-server.js
      - name: Lint (eslint — errors block, warnings allowed)
        run: npm run lint
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      # 本地 Windows 生成的 lock 只记录了 win32 的 esbuild/rollup 平台二进制，
      # npm ci 严格按 lock 只装 win32、npm install 也会沿用 lock 的 win32 记录，
      # 都会导致 ubuntu runner 缺 linux 原生二进制、vite import rollup 时崩溃。
      # 用 --no-package-lock 完全忽略 lock，让 runner 在 linux 上重新解析并装正确平台的原生依赖。
      - name: Install deps
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build (vite)
        run: npm run build
      - name: Frontend tests and accessibility checks
        run: npm test
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (eslint — errors block, warnings allowed)
        run: npm run lint
      - name: Lint styles
        run: npm run lint:css
