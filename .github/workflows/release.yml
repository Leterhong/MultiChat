name: Release

# 推送 v* tag 触发：校验版本号 → 全量构建 → 发布 npm → 创建 GitHub Release。
# 前置条件：仓库 Secrets 里配置 NPM_TOKEN（npm 账号的 Automation token）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Publish npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag 是 v$tag，但 package.json 版本是 $pkg；两者必须一致"
            exit 1
          fi
      - name: Token preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          if ! npm whoami 2>&1 | tee npm-preflight.txt; then
            echo "::error::NPM_TOKEN 无效（E401）。请到 npmjs.com/settings/~/tokens 重新生成 Classic Token（类型 Automation），并更新仓库 Secret NPM_TOKEN"
            exit 1
          fi
          {
            echo "== npm whoami =="
            npm whoami
            echo "== org leterhong 成员/角色 =="
            npm org ls leterhong --json 2>&1 || true
          } | tee npm-preflight.txt
      - name: Install & build (发布物里的 dist 必须 freshly built)
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm run build
      - name: CLI sanity (doctor)
        run: node ./bin/multichat.mjs doctor
      - name: Publish to npm
        id: publish
        run: |
          set -o pipefail
          npm publish --access public 2>&1 | tee npm-publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 发布失败时把 npm 完整输出存为构件，便于匿名诊断（公共仓库构件可匿名下载）。
      - name: Upload publish log on failure
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publish-error
          path: npm-publish.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
