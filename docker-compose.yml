services:
  multichat:
    build: .
    container_name: multichat
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # 数据持久化（对话 / Provider / 工作区等本地 JSON）
      - multichat-data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # 远程 MCP 会执行插件声明的进程，默认关闭；仅在可信环境显式开启。
      - MULTICHAT_ALLOW_REMOTE_MCP=${MULTICHAT_ALLOW_REMOTE_MCP:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  multichat-data:
